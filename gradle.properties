# 开源版默认面向桌面与GitHub Actions；低内存设备可在用户Gradle配置中调整堆上限。
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

android.useAndroidX=true
kotlin.code.style=official

# ---- 并发与 daemon 限制（闪退的次要原因） ----
# 曾经同时存活 19 个 daemon，每个都吃内存 → 必然 OOM。
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.daemon.idletimeout=60000

org.gradle.caching=true

# ⚠ R8 全量模式做激进全局优化，低内存 ARM 上极易被杀。
# 关掉退到兼容模式，内存和时间都省一半以上。
android.enableR8.fullMode=false

android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE